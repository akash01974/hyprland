env = XCURSOR_THEME,WhiteSur-cursors
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,WhiteSur-cursors
env = HYPRCURSOR_SIZE,24

cursor {
    # Force software cursor rendering to eliminate HW→SW cursor plane flicker
    # when cursor-shape-v1 or surface changes occur during Thunar navigation
    no_hardware_cursors = true
}

exec-once = hyprctl setcursor WhiteSur-cursors 24

source = ~/.config/hypr/hypridle.conf
source = ~/.config/hypr/hyprlock-colors.conf
source = ~/.config/hypr/hyprlock.conf
