source = ~/.config/hypr/hyprlock-colors.conf

background {
    monitor =
    path = /home/akash/.cache/hyprlock/current.jpg
    blur_passes = 3
    blur_size = 7
    contrast = 0.9
    brightness = 0.45
    vibrancy = 0.15
    vibrancy_darkness = 0.3
}

general {
    no_fade_in = false
    no_fade_out = false
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
}

input-field {
    monitor =
    size = 280, 55
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.1)
    inner_color = rgba(0, 0, 0, 0.15)
    font_color = $foreground
    font_family = Nunito
    fade_on_empty = true
    rounding = 27
    check_color = $primary
    fail_color = rgba(255, 100, 100, 0.8)
    placeholder_text = <span foreground="##aaaaaa" font_family="Nunito">󰌾  Enter Password</span>
    fail_text = <span foreground="##ff6464" font_family="Nunito">󰅙  Wrong Password</span>
    hide_input = false
    position = 0, -200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = $on_surface_variant
    font_size = 20
    font_family = Nunito
    position = 0, 300
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%-I:%M")"
    color = $foreground
    font_size = 96
    font_family = Nunito Bold
    position = 0, 200
    halign = center
    valign = center
}

image {
    monitor =
    # path = /home/akash/Pictures/profile.png
    size = 100
    border_size = 2
    border_color = $primary
    position = 0, -100
    halign = center
    valign = center
}

image {
    monitor =
    path = /home/akash/Pictures/hypr.png
    size = 75
    border_size = 2
    border_color = $outline
    position = -50, 50
    halign = right
    valign = bottom
}

label {
    monitor =
    text = cmd[update:1000] echo "$(/home/akash/.config/hypr/scripts/whatsong.sh)"
    color = $on_surface_variant
    font_size = 16
    font_family = Nunito Light
    position = 0, 50
    halign = center
    valign = bottom
}: