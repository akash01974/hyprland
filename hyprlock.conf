source = ~/.config/hypr/hyprlock-colors.conf

background {
    monitor =
    path = /home/akash/.cache/hyprlock/current.jpg
    blur_passes = 2
    contrast = 1
    brightness = 0.5
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

general {
    no_fade_in = true
    no_fade_out = true
    hide_cursor = false
    grace = 0
    disable_loading_bar = true
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = $surface
    inner_color = rgba(0, 0, 0, 0.2)
    font_color = $foreground
    fade_on_empty = false
    rounding = -1
    check_color = $primary
    placeholder_text = <span foreground="##aaaaaa">Enter Password</span>
    fail_text = <span foreground="##ffffff">Authentication failed</span>
    hide_input = false
    position = 0, -200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = $on_surface_variant
    font_size = 22
    font_family = JetBrains Mono
    position = 0, 300
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%-I:%M")"
    color = $foreground
    font_size = 95
    font_family = JetBrains Mono Extrabold
    position = 0, 200
    halign = center
    valign = center
}

image {
    monitor =
    path = /home/akash/Pictures/profile.png
    size = 100
    border_size = 2
    border_color = $primary
    position = 0, -100
    halign = center
    valign = center
}

image {
    monitor =
    path = /home/akash/Pictures/hypr.png
    size = 75
    border_size = 2
    border_color = $outline
    position = -50, 50
    halign = right
    valign = bottom
}

label {
    monitor =
    text = cmd[update:1000] echo "$(/home/akash/.config/hypr/scripts/whatsong.sh)"
    color = $on_surface_variant
    font_size = 18
    font_family = Metropolis Light, Font Awesome 6 Free Solid
    position = 0, 50
    halign = center
    valign = bottom
}
